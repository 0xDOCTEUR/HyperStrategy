name: Commandes Telegram

on:
  # Toutes les 5 minutes (UTC) — traite /rapport /btc etc. même PC éteint
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commandes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Traiter les commandes en attente
        run: npm run bot:commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ASSETS: BTC,ETH,SOL,HYPE
          TELEGRAM_INTERVAL: 4h

      - name: Sauver l’offset Telegram
        run: |
          git config user.name "hl-ta-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data || true
          git diff --staged --quiet || git commit -m "chore: offset commandes $(date -u +%Y-%m-%dT%H:%MZ)"
          git push || true
